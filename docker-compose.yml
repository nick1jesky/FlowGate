services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowgate
      POSTGRES_PASSWORD: flowgate
      POSTGRES_DB: flowgate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowgate -d flowgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  flowgate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - dlq_data:/app/data/dlq
    environment:
      DATABASE_URL: "postgres://flowgate:flowgate@postgres:5432/flowgate?sslmode=disable"
      PORT: "8080"
      REDIS_ADDR: "redis:6379"

      WORKERS_COUNT: "${WORKERS_COUNT:-5}"
      CHANNEL_BUFFER: "${CHANNEL_BUFFER:-100}"

      DB_MAX_CONNS: "${DB_MAX_CONNS:-20}"
      DB_MIN_CONNS: "${DB_MIN_CONNS:-2}"
      DB_MAX_CONN_LIFETIME: "${DB_MAX_CONN_LIFETIME:-30m}"
      DB_MAX_CONN_IDLE_TIME: "${DB_MAX_CONN_IDLE_TIME:-5m}"
      DB_HEALTH_CHECK_PERIOD: "${DB_HEALTH_CHECK_PERIOD:-1m}"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-5s}"

      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_DIAL_TIMEOUT: "${REDIS_DIAL_TIMEOUT:-2s}"
      REDIS_READ_TIMEOUT: "${REDIS_READ_TIMEOUT:-500ms}"
      REDIS_WRITE_TIMEOUT: "${REDIS_WRITE_TIMEOUT:-500ms}"
      REDIS_POOL_SIZE: "${REDIS_POOL_SIZE:-20}"
      REDIS_PING_TIMEOUT: "${REDIS_PING_TIMEOUT:-2s}"
      READINESS_TIMEOUT: "${READINESS_TIMEOUT:-2s}"

      INGEST_SUBMIT_TIMEOUT: "${INGEST_SUBMIT_TIMEOUT:-100ms}"
      INGEST_TASK_TIMEOUT: "${INGEST_TASK_TIMEOUT:-5s}"
      INGEST_SHUTDOWN_TIMEOUT: "${INGEST_SHUTDOWN_TIMEOUT:-10s}"
      INGEST_BATCH_MAX_SIZE: "${INGEST_BATCH_MAX_SIZE:-500}"
      INGEST_BATCH_MAX_DELAY: "${INGEST_BATCH_MAX_DELAY:-200ms}"
      INGEST_FLUSH_MAX_RETRIES: "${INGEST_FLUSH_MAX_RETRIES:-3}"
      INGEST_FLUSH_RETRY_BACKOFF: "${INGEST_FLUSH_RETRY_BACKOFF:-200ms}"
      INGEST_DLQ_PATH: "${INGEST_DLQ_PATH:-/app/data/dlq/flowgate-dlq.jsonl}"

      CACHE_TTL: "${CACHE_TTL:-60s}"
      CACHE_STALE_AFTER: "${CACHE_STALE_AFTER:-30s}"
      CACHE_REFRESH_TIMEOUT: "${CACHE_REFRESH_TIMEOUT:-5s}"

      HTTP_SHUTDOWN_TIMEOUT: "${HTTP_SHUTDOWN_TIMEOUT:-5s}"

      MV_VIEW_NAME: "${MV_VIEW_NAME:-agg_metrics_1m}"
      MV_REFRESH_MIN_INTERVAL: "${MV_REFRESH_MIN_INTERVAL:-5s}"
      MV_REFRESH_MAX_INTERVAL: "${MV_REFRESH_MAX_INTERVAL:-60s}"
      MV_REFRESH_HIGH_RATE_THRESHOLD: "${MV_REFRESH_HIGH_RATE_THRESHOLD:-500}"
      MV_REFRESH_LOW_RATE_THRESHOLD: "${MV_REFRESH_LOW_RATE_THRESHOLD:-50}"
      MV_RATE_REDIS_KEY: "${MV_RATE_REDIS_KEY:-flowgate:ingest:rate}"

      API_KEYS: "${API_KEYS:-}"
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-100}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-200}"


  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - flowgate
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

volumes:
  pgdata:
  dlq_data:
  grafana_data:
