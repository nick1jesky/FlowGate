services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowgate
      POSTGRES_PASSWORD: flowgate
      POSTGRES_DB: flowgate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowgate -d flowgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  flowgate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://flowgate:flowgate@postgres:5432/flowgate?sslmode=disable"
      PORT: "8080"
      REDIS_ADDR: "redis:6379"

      WORKERS_COUNT: "${WORKERS_COUNT:-5}"
      CHANNEL_BUFFER: "${CHANNEL_BUFFER:-100}"

      DB_MAX_CONNS: "${DB_MAX_CONNS:-20}"
      DB_MIN_CONNS: "${DB_MIN_CONNS:-2}"
      DB_MAX_CONN_LIFETIME: "${DB_MAX_CONN_LIFETIME:-30m}"
      DB_MAX_CONN_IDLE_TIME: "${DB_MAX_CONN_IDLE_TIME:-5m}"
      DB_HEALTH_CHECK_PERIOD: "${DB_HEALTH_CHECK_PERIOD:-1m}"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-5s}"

      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_DIAL_TIMEOUT: "${REDIS_DIAL_TIMEOUT:-2s}"
      REDIS_READ_TIMEOUT: "${REDIS_READ_TIMEOUT:-500ms}"
      REDIS_WRITE_TIMEOUT: "${REDIS_WRITE_TIMEOUT:-500ms}"
      REDIS_POOL_SIZE: "${REDIS_POOL_SIZE:-20}"
      REDIS_PING_TIMEOUT: "${REDIS_PING_TIMEOUT:-2s}"

      INGEST_SUBMIT_TIMEOUT: "${INGEST_SUBMIT_TIMEOUT:-100ms}"
      INGEST_TASK_TIMEOUT: "${INGEST_TASK_TIMEOUT:-5s}"
      INGEST_SHUTDOWN_TIMEOUT: "${INGEST_SHUTDOWN_TIMEOUT:-10s}"

      CACHE_TTL: "${CACHE_TTL:-60s}"
      CACHE_STALE_AFTER: "${CACHE_STALE_AFTER:-30s}"
      CACHE_REFRESH_TIMEOUT: "${CACHE_REFRESH_TIMEOUT:-5s}"

      HTTP_SHUTDOWN_TIMEOUT: "${HTTP_SHUTDOWN_TIMEOUT:-5s}"

volumes:
  pgdata:
